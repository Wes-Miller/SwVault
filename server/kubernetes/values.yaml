# Helm values for the official Gitea chart (https://gitea.com/gitea/helm-gitea) on the CU OIT
# Container Platform (or any Kubernetes).
#   helm repo add gitea-charts https://dl.gitea.com/charts/
#   helm install swvault gitea-charts/gitea -n <namespace> -f values.yaml
#
# Ask OIT for: a namespace, persistent volume size (start at 200Gi; LFS content grows with every
# version), and an ingress hostname. The ingress must allow large request bodies for LFS uploads.

image:
  tag: "1.27.3"

replicaCount: 1

persistence:
  enabled: true
  size: 200Gi

# Single-instance SQLite keeps the deployment to one pod with no external database.
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
valkey-cluster:
  enabled: false
valkey:
  enabled: false

gitea:
  admin:
    existingSecret: swvault-gitea-admin # keys: username, password (create before installing)
  config:
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    server:
      DOMAIN: vault.example.edu
      ROOT_URL: https://vault.example.edu/
      DISABLE_SSH: true
      LFS_START_SERVER: true
      LFS_MAX_FILE_SIZE: 4294967296
    repository:
      DEFAULT_BRANCH: main
    service:
      DISABLE_REGISTRATION: true
      REQUIRE_SIGNIN_VIEW: true
    oauth2:
      ENABLED: true

ingress:
  enabled: true
  annotations:
    # nginx ingress defaults to a 1 MB body limit, which would break LFS uploads.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
  hosts:
    - host: vault.example.edu
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - vault.example.edu
      secretName: swvault-tls
