# SwVault vault server for a Linux box on a network you don't control (apartment, dorm, CGNAT).
#
# Gitea (git + Git LFS + LFS file locking) runs inside the network namespace of a Tailscale
# container. Tailscale Funnel publishes it at https://<TS_HOSTNAME>.<tailnet>.ts.net with a
# real certificate, using outbound connections only: no port forwarding, no static IP, no
# dynamic DNS, and team members don't install anything besides SwVault.
#
# Don't edit .env by hand unless you know why; setup.sh writes it. Day-to-day: swvault-admin.sh.
name: swvault

services:
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_TAG:-stable}
    hostname: ${TS_HOSTNAME:-swvault}
    restart: unless-stopped
    environment:
      # Only needed the first time; the node key is kept in ./data/tailscale afterwards.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      # Funnel config: public HTTPS on 443 -> Gitea on 127.0.0.1:3000 (see tailscale-serve.json).
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    ports:
      # Local-only access for the admin scripts on this machine. Nothing is opened to the LAN.
      - "127.0.0.1:3000:3000"

  gitea:
    image: docker.gitea.com/gitea:${GITEA_TAG:-1.27.3}
    network_mode: service:tailscale
    restart: unless-stopped
    depends_on:
      - tailscale
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      # Headless install: no web installer; secrets come from .env (generated by setup.sh).
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:-}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:-}
      GITEA__server__LFS_JWT_SECRET: ${GITEA_LFS_JWT_SECRET:-}
      GITEA__oauth2__JWT_SECRET: ${GITEA_OAUTH_JWT_SECRET:-}
      GITEA__server__DOMAIN: ${VAULT_HOSTNAME:-localhost}
      GITEA__server__ROOT_URL: https://${VAULT_HOSTNAME:-localhost}/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__OFFLINE_MODE: "true"
      # Git LFS: file content and the lock API SwVault uses for check-out.
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__server__LFS_MAX_FILE_SIZE: "4294967296" # 4 GB per file
      GITEA__repository__DEFAULT_BRANCH: main
      # The server is on the public internet (through Funnel): accounts come only from the
      # admin (swvault-admin.sh add-user), and nothing is visible without signing in.
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      GITEA__service__DEFAULT_USER_VISIBILITY: private
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__mailer__ENABLED: "false"
      GITEA__api__ENABLE_SWAGGER: "false"
      GITEA__cron.update_checker__ENABLED: "false"
      GITEA__log__LEVEL: Warn
    volumes:
      - ./data/gitea:/data
